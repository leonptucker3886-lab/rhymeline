<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhymeline</title>
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="Write a line. Hit help. Finish the rhyme.">
<style>
:root{
  --bg:#0b0c10;--card:#15171d;--line:#262a33;--tx:#eceef3;--mut:#8b91a0;
  --ac:#7c5cff;--ac-dim:rgba(124,92,255,.15);--ok:#3dd68c;--warn:#f5a524;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:26px;margin:0;letter-spacing:-.4px}
h1 span{color:var(--ac)}
.s{color:var(--mut);margin:4px 0 18px;font-size:15px}
textarea{
  width:100%;min-height:100px;background:var(--card);color:var(--tx);
  border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;
  resize:vertical;outline:none;transition:border-color .15s;
}
textarea:focus{border-color:var(--ac)}
textarea::placeholder{color:var(--mut)}
.syl-live{
  display:flex;justify-content:space-between;align-items:center;
  margin:6px 2px 0;font-size:13px;color:var(--mut);
}
.syl-live strong{color:var(--tx);font-weight:600}
.syl-live .good{color:var(--ok)}
.syl-live .long{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.chip{
  background:var(--card);border:1px solid var(--line);color:var(--tx);
  padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;
  cursor:pointer;transition:background .12s,border-color .12s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.chip:hover{border-color:var(--ac)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
.go{
  width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;
  padding:15px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px;
  transition:opacity .15s,transform .1s;
}
.go:hover{opacity:.92}
.go:active{transform:scale(.99)}
.go:disabled{opacity:.5;cursor:not-allowed}
#sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(4px);
}
#sheet.show{display:flex}
.panel{
  background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px 36px;
  width:100%;max-width:560px;animation:slideUp .22s ease-out;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel h3{margin:0 0 14px;font-size:17px}
.opt{
  display:block;width:100%;text-align:left;background:var(--bg);
  border:1px solid var(--line);color:var(--tx);padding:14px 16px;
  border-radius:12px;margin-bottom:8px;font:inherit;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ac);background:var(--ac-dim)}
.opt small{display:block;color:var(--mut);margin-top:2px;font-size:13px}
.out{margin-top:20px}
.bar{
  display:flex;gap:8px;padding:12px;border:1px solid var(--line);
  background:var(--card);border-radius:12px;margin-bottom:7px;
  align-items:flex-start;flex-wrap:wrap;
}
.bar b{color:var(--ac);min-width:16px;font-size:13px;padding-top:2px}
.bar .txt{flex:1;min-width:140px;line-height:1.4}
.bar .meta{color:var(--mut);font-size:12px;padding-top:2px;white-space:nowrap}
.bar .actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bar .actions .chip{padding:5px 11px;font-size:12px}
.mine{border-color:var(--ac);background:var(--ac-dim)}
.bar:not(.mine){cursor:pointer}
.bar:not(.mine):hover{border-color:var(--ac)}
.bar.busy{opacity:.55;pointer-events:none}
.w{display:inline-block;margin:0 6px 6px 0}
.w .tag{font-size:10px;opacity:.7;margin-left:3px}
.hint{color:var(--mut);font-size:13px;margin-top:8px;line-height:1.4}
.loading{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;padding:8px 0}
.spinner{
  width:16px;height:16px;border:2px solid var(--line);
  border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%);
  background:var(--card);border:1px solid var(--line);color:var(--tx);
  padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;
  text-align:center;
}
.toast.show{opacity:1}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:6px;width:100%}
.alt-row{
  display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:var(--bg);border-radius:10px;border:1px solid var(--line);
}
.alt-row .txt{flex:1;font-size:14px}
@media (max-width:420px){

  main{padding:18px 12px 100px}
  .bar .actions{width:100%;margin-left:0;margin-top:4px}
  .chip{padding:7px 12px;font-size:12px}
}
.bar .syl{color:var(--mut);font-size:11px;padding-top:3px}
.err{color:var(--warn)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:28px}
.rl-tabs{display:flex;gap:8px;margin:0 0 14px}.rl-tabs a{padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:inherit;text-decoration:none;font-size:13px;font-weight:600}.rl-tabs a.on{background:rgba(255,255,255,.14)}
</style></head>
<body>
<main>
  <nav class="rl-tabs"><a href="/" class="on">✍️ Write</a><a href="/perform">🎤 Perform</a></nav>
  <h1>Rhyme<span>line</span></h1>
  <p class="s">Write a line. Hit help. Finish the rhyme.</p>
  <textarea id="t" maxlength="300" placeholder="I saw you outside when I drove by" rows="3" aria-label="Your line"></textarea>
  <div class="syl-live"><span>Syllables: <strong id="sylCount">0</strong></span><span id="sylHint">Aim for 7-12</span></div>
  <div class="lbl">Rhyme scheme</div>
  <div class="row" id="sch"></div>
  <div class="row"><button class="chip" id="sl" type="button">Near rhymes: off</button></div>
  <button class="go" id="help" type="button">Help <small style="opacity:.7;font-weight:400">(Ctrl+Enter)</small></button>
  <div id="out" class="out" aria-live="polite"></div>
  <p class="foot">Your line and settings are saved on this device.</p>
</main>
<div id="sheet" role="dialog" aria-label="How much help?"><div class="panel">
  <h3>How much help?</h3>
  <button class="opt" data-m="word" type="button">Just a word<small>Rhymes for your last word (ranked)</small></button>
  <button class="opt" data-m="line" type="button">One sentence<small>3 options to finish your line</small></button>
  <button class="opt" data-m="verse" type="button">16 bars<small>Full verse in your chosen scheme</small></button>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.floor(Math.random()*a.length)];
const SCH=['AABB','ABAB','ABBA','AAAA'];const ST=JSON.parse(localStorage.getItem('rl')||'{}');let scheme=ST.scheme||'AABB',slant=!!ST.slant,pools={},bars=[],isAI=false;
SCH.forEach(s=>{const b=document.createElement('button');b.className='chip'+(s==scheme?' on':'');b.textContent=s;b.onclick=()=>{scheme=s;save();[...$('#sch').children].forEach(c=>c.classList.toggle('on',c==b))};$('#sch').append(b)});
const slUI=()=>{$('#sl').textContent='Near rhymes: '+(slant?'on':'off');$('#sl').classList.toggle('on',slant)};slUI();
$('#sl').onclick=()=>{slant=!slant;slUI();save()};
function save(){localStorage.setItem('rl',JSON.stringify({scheme,slant,t:$('#t').value}))}
const syl=s=>(s.toLowerCase().match(/[a-z']+/g)||[]).reduce((n,w)=>{w=w.replace(/'/g,'');if(w.length<=3)return n+1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return n+(m?m.length:1)},0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)};
function sylUI(){const n=syl($('#t').value),h=$('#sylHint');$('#sylCount').textContent=n;h.className=n>=7&&n<=12?'good':n>12?'long':'';h.textContent=n>12?'Long - try trimming':n>=7?'Good length':'Aim for 7-12'}
if(ST.t)$('#t').value=ST.t;sylUI();$('#t').oninput=()=>{sylUI();save()};
$('#t').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#sheet').classList.add('show')}};
document.onkeydown=e=>{if(e.key==='Escape')$('#sheet').classList.remove('show')};
const dm=async q=>{try{return await (await fetch('https://api.datamuse.com/words?'+q)).json()}catch(e){return[]}};
const last=t=>{const m=t.trim().toLowerCase().match(/[a-z']+(?=[^a-z']*$)/);return m?m[0]:''};
const ok=(x,w)=>/^[a-z]+$/.test(x.word)&&x.word!==w;
async function rh(w){const[p,n]=await Promise.all([dm('rel_rhy='+w+'&max=80'),dm('rel_nry='+w+'&max=50')]);return{p:p.filter(x=>ok(x,w)).map(x=>x.word),n:n.filter(x=>ok(x,w)).map(x=>x.word)}}
const pool=r=>{let a=slant?r.p.concat(r.n):r.p.length<6?r.p.concat(r.n):r.p;return a.sort(()=>Math.random()-.5)};
async function ai(line,mode){try{const r=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line,mode,scheme,slant})});if(!r.ok)return null;const j=await r.json();return Array.isArray(j.lines)&&j.lines.length?j.lines:null}catch(e){return null}}
async function build(end){let w=[end],s=((await dm('sp='+end+'&md=s&max=1'))[0]||{}).numSyllables||1,g=0;
while(s<9&&g++<6){const r=(await dm('rel_bgb='+w[0]+'&md=s&max=20')).filter(x=>/^[a-z']+$/.test(x.word)&&!w.includes(x.word));if(!r.length)break;const x=pick(r.slice(0,10));w.unshift(x.word);s+=x.numSyllables||1}
const t=w.join(' ');return t[0].toUpperCase()+t.slice(1)}
async function seed(line,avoid){const ws=line.toLowerCase().match(/[a-z]{4,}/g)||[],c=[];
for(const w of ws.slice(-2)){(await dm('ml='+w+'&max=25')).forEach(x=>/^[a-z]+$/.test(x.word)&&c.push(x.word))}
c.push('night','way','mind','time','soul','gold');
for(const w of c.sort(()=>Math.random()-.5).slice(0,8)){const r=await rh(w);if(r.p.length>=10&&!avoid.includes(w)&&!r.p.includes(avoid[0]))return r}return rh('night')}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){$('#out').innerHTML='<div class="lbl">'+(isAI?'AI-written (Gemini)':'Basic engine - tap a line to re-roll it')+'</div>'+bars.map((b,i)=>'<div class="bar'+(b.mine?' mine':'')+'" data-i="'+i+'"><b>'+b.l+'</b><span class="txt">'+esc(b.t)+'</span><span class="syl">'+syl(b.t)+'</span></div>').join('')+'<div class="row"><button class="chip" id="cp">Copy all</button></div>';
$('#cp').onclick=()=>{navigator.clipboard.writeText(bars.map(b=>b.t).join('\n')).then(()=>toast('Copied all bars'),()=>toast('Copy failed'))};
if(!isAI)document.querySelectorAll('.bar:not(.mine)').forEach(el=>el.onclick=async()=>{const b=bars[+el.dataset.i],p=pools[b.l];if(!p||!p.length)return;el.style.opacity=.5;b.t=await build(p.shift());draw()})}
async function run(m){const txt=$('#t').value.trim(),w=last(txt),o=$('#out');
if(!w){o.innerHTML='<p class="hint">Write a line first.</p>';return}
o.innerHTML='<div class="loading"><div class="spinner"></div>Writing...</div>';$('#help').disabled=true;try{
if(m!='word'){const L2=await ai(txt,m);if(L2){isAI=true;const S=[...scheme];bars=[{l:'A',t:txt,mine:1}];L2.forEach((t,i)=>bars.push({l:m=='line'?'A':S[(i+1)%S.length],t}));draw();return}}
isAI=false;const A=await rh(w);
if(m=='word'){const ch=a=>a.slice(0,40).map(x=>'<button class="chip w">'+x+'</button>').join('');
o.innerHTML='<div class="lbl">Perfect rhymes for "'+w+'"</div>'+(ch(A.p)||'<p class="hint">None found.</p>')+'<div class="lbl">Near rhymes</div>'+(ch(A.n)||'<p class="hint">None found.</p>')+'<p class="hint">Tap a word to add it to your line.</p>';
o.querySelectorAll('.w').forEach(b=>b.onclick=()=>{$('#t').value=txt+' '+b.textContent;sylUI();save();toast('Added "'+b.textContent+'"')});return}
pools={A:pool(A)};bars=[{l:'A',t:txt,mine:1}];
if(m=='line'){for(let i=0;i<3;i++)bars.push({l:'A',t:await build(pools.A.shift())});draw();return}
const L=[...scheme],n=15;if(new Set(L).size>1)pools.B=pool(await seed(txt,[w]));
const plan=[];for(let i=1;i<=n;i++)plan.push(L[i%L.length]);
for(const l of plan){if(!pools[l]||!pools[l].length)pools[l]=pool(await rh(w));bars.push({l,t:'',e:pools[l].shift()})}
await Promise.all(bars.filter(b=>!b.mine).map(async b=>{b.t=await build(b.e)}));draw()}catch(e){o.innerHTML='<p class="hint err">Something went wrong. Check your connection and try again.</p>'}finally{$('#help').disabled=false}}
$('#help').onclick=()=>$('#sheet').classList.add('show');
$('#sheet').onclick=e=>{if(e.target.id=='sheet')$('#sheet').classList.remove('show')};
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{$('#sheet').classList.remove('show');run(b.dataset.m)});
</script></body></html>
